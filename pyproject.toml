[project]
name = "xtce2py"
version = "0.1.0"
description = "Generates a Python package from a source XTCE file."
authors = [
    {name = "Nathan Miersen", email = "nrmiersen@gmail.com"},
]
dependencies = ["pydantic>=2.11.7", "xsdata>=25.7"]
requires-python = "==3.11.*"
readme = "README.md"
license = {text = "MIT"}


[tool.pdm]
distribution = false


[dependency-groups]
dev = [
    "xsdata[cli]>=25.7",
]
