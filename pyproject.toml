[project]
name = "xtce2py"
version = "0.1.0"
description = "A generator for creating Python parsers from XTCE files."
authors = [{ name = "Nathan Miersen", email = "nrmiersen@gmail.com" }]
dependencies = [
    "pydantic>=2.11.7",
    "xsdata>=25.7",
    "typer>=0.16.0",
    "rich>=14.0.0",
    "jinja2>=3.1.6",
    "black>=25.1.0",
]
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }


[dependency-groups]
dev = ["xsdata[cli]>=25.7"]


[tool.pdm.scripts]
xtce2py = "python -m xtce2py.main"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "D", # pydocstyle
    "I", # isort
]

[tool.ruff.lint.isort]
known-first-party = ["xtce2py"]

[tool.ruff.format]
docstring-code-format = true

[tool.docformatter]
wrap-summaries = 72
wrap-descriptions = 72
